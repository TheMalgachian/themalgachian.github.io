<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes sites</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f7f9;--fg:#18202c;--muted:#5d6878;--line:#d9dee6;--card:#fff;--accent:#0047a6}
@media (prefers-color-scheme:dark){:root{--bg:#0e131b;--fg:#e7ebf1;--muted:#9aa5b5;--line:#263040;--card:#151c27;--accent:#6ea2ef;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",sans-serif;padding:48px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--fg);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent)}
a span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Mes sites</h1>
  <p>Un dossier par site dans ce dépôt.</p>
  <ul>
    <li><a href="air-tech/"><strong>Air-Tech</strong><span>air-tech/</span></a></li>
    <li><a href="https://vidantik.fr/"><strong>Vid'antik</strong><span>vidantik.fr</span></a></li>
  </ul>
</main>
</body>
</html>
